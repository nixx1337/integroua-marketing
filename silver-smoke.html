<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Liquid Smoke Ribbons — Pure CSS Background</title>
  <style>
    /* ==========================================================================
       RESET & VIEWPORT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* ==========================================================================
       TUNING KNOBS (Adjust these pairs to customize the effect)
       1. Contrast = edge hardness, Blur = softness (tune as a pair: blur 30-40px, contrast 3.8-5.0)
       2. Spread between shadow and specular stops = strength of the metal effect
       3. .sheen opacity = striation intensity (0.6 - 0.9)
       ========================================================================== */

    /* --------------------------------------------------------------------------
       1. THE SMOKE ENGINE WRAPPER
       Negative inset prevents blurred edges from exposing viewport boundaries.
       High contrast + heavy blur melts ring gradients into defined silver ribbons.
       -------------------------------------------------------------------------- */
    .smoke {
      position: fixed;
      inset: -25%;
      width: 150%;
      height: 150%;
      pointer-events: none;
      z-index: 1;
      filter: blur(28px) contrast(2.3) brightness(1.08);
      overflow: hidden;
      background: #000000;
    }

    .smoke span {
      position: absolute;
      inset: 0;
      will-change: background-position;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       METALLIC PLATINUM GRADIENT LAYERS (4:6 Black to Bright Ratio)
       -------------------------------------------------------------------------- */

    /* Layer 1: 43s duration — Diagonal left-to-right drift */
    .smoke span:nth-child(1) {
      background-image: radial-gradient(ellipse 58% 38% at 35% 40%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            12%,
        rgba(140, 138, 134, 0.45)   20%,
        rgba(195, 193, 189, 0.78)   30%,
        rgba(235, 234, 231, 0.94)   40%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(241, 240, 237, 0.95)   58%,
        rgba(215, 214, 210, 0.82)   68%,
        rgba(150, 148, 144, 0.50)   76%,
        rgba(0, 0, 0, 0)            86%
      );
      background-size: 200% 200%;
      background-position: 10% 20%;
      transform: rotate(-14deg) scale(1.15);
      animation: driftLayer1 43s ease-in-out infinite alternate;
    }

    /* Layer 2: 53s duration — Upward-surging sweep */
    .smoke span:nth-child(2) {
      background-image: radial-gradient(ellipse 52% 48% at 65% 55%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            10%,
        rgba(135, 133, 129, 0.42)   18%,
        rgba(190, 188, 184, 0.76)   28%,
        rgba(230, 229, 226, 0.92)   38%,
        rgba(255, 255, 255, 1.00)   48%,
        rgba(240, 239, 236, 0.94)   56%,
        rgba(210, 209, 205, 0.80)   66%,
        rgba(145, 143, 139, 0.48)   75%,
        rgba(0, 0, 0, 0)            85%
      );
      background-size: 240% 210%;
      background-position: 80% 90%;
      transform: rotate(18deg) scale(1.2);
      animation: driftLayer2 53s ease-in-out infinite alternate;
    }

    /* Layer 3: 67s duration — Horizontal wave crossing */
    .smoke span:nth-child(3) {
      background-image: radial-gradient(ellipse 64% 34% at 42% 68%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            12%,
        rgba(142, 140, 136, 0.46)   20%,
        rgba(200, 198, 194, 0.80)   30%,
        rgba(238, 237, 234, 0.95)   42%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(242, 241, 238, 0.94)   58%,
        rgba(218, 217, 213, 0.82)   68%,
        rgba(152, 150, 146, 0.50)   76%,
        rgba(0, 0, 0, 0)            86%
      );
      background-size: 190% 270%;
      background-position: 30% 70%;
      transform: rotate(-28deg) scale(1.12);
      animation: driftLayer3 67s ease-in-out infinite alternate;
    }

    /* Layer 4: 83s duration — Sweeping diagonal counter-flow */
    .smoke span:nth-child(4) {
      background-image: radial-gradient(ellipse 46% 56% at 72% 32%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            11%,
        rgba(138, 136, 132, 0.44)   19%,
        rgba(192, 190, 186, 0.76)   29%,
        rgba(232, 231, 228, 0.92)   40%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(240, 239, 236, 0.94)   58%,
        rgba(212, 211, 207, 0.80)   68%,
        rgba(146, 144, 140, 0.48)   76%,
        rgba(0, 0, 0, 0)            85%
      );
      background-size: 290% 220%;
      background-position: 85% 15%;
      transform: rotate(12deg) scale(1.18);
      animation: driftLayer4 83s ease-in-out infinite alternate;
    }

    /* Layer 5: 109s duration — Deep slow ambient undulation */
    .smoke span:nth-child(5) {
      background-image: radial-gradient(ellipse 68% 42% at 25% 62%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            12%,
        rgba(140, 138, 134, 0.45)   20%,
        rgba(196, 194, 190, 0.78)   30%,
        rgba(236, 235, 232, 0.94)   40%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(241, 240, 237, 0.95)   58%,
        rgba(216, 215, 211, 0.82)   68%,
        rgba(150, 148, 144, 0.50)   76%,
        rgba(0, 0, 0, 0)            86%
      );
      background-size: 250% 300%;
      background-position: 15% 85%;
      transform: rotate(-6deg) scale(1.25);
      animation: driftLayer5 109s ease-in-out infinite alternate;
    }

    /* --------------------------------------------------------------------------
       LAYER KEYFRAMES (background-position only, non-repeating primes)
       -------------------------------------------------------------------------- */
    @keyframes driftLayer1 {
      0%   { background-position: 10% 20%; }
      50%  { background-position: 85% 45%; }
      100% { background-position: 35% 90%; }
    }

    @keyframes driftLayer2 {
      0%   { background-position: 80% 90%; }
      50%  { background-position: 25% 60%; }
      100% { background-position: 70% 15%; }
    }

    @keyframes driftLayer3 {
      0%   { background-position: 30% 70%; }
      50%  { background-position: 90% 25%; }
      100% { background-position: 15% 35%; }
    }

    @keyframes driftLayer4 {
      0%   { background-position: 85% 15%; }
      50%  { background-position: 15% 80%; }
      100% { background-position: 60% 95%; }
    }

    @keyframes driftLayer5 {
      0%   { background-position: 15% 85%; }
      50%  { background-position: 80% 40%; }
      100% { background-position: 45% 10%; }
    }

    /* --------------------------------------------------------------------------
       2. METALLIC SHEEN LAYER
       -------------------------------------------------------------------------- */
    .sheen {
      position: fixed;
      inset: -15%;
      width: 130%;
      height: 130%;
      pointer-events: none;
      z-index: 2;
      background-image: linear-gradient(
        125deg,
        rgba(229, 228, 226, 0)    0%,
        rgba(241, 240, 237, 0.12) 30%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(229, 228, 226, 0.12) 70%,
        rgba(229, 228, 226, 0)    100%
      );
      background-size: 240% 240%;
      background-position: 0% 0%;
      mix-blend-mode: soft-light;
      filter: blur(24px);
      opacity: 0.85;
      will-change: background-position;
      animation: sheenMotion 73s ease-in-out infinite alternate;
    }

    @keyframes sheenMotion {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 40% 100%; }
    }

    /* --------------------------------------------------------------------------
       3. GRAIN LAYER
       -------------------------------------------------------------------------- */
    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.06;
      mix-blend-mode: overlay;
    }

    /* --------------------------------------------------------------------------
       4. VIGNETTE LAYER
       Soft falloff towards borders ensuring pure pitch-black framing.
       -------------------------------------------------------------------------- */
    .vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.6) 100%);
    }

    /* --------------------------------------------------------------------------
       5. CONTENT LAYER (Centered Hero Text)
       Enhanced with deep multi-level text-shadow for permanent legibility.
       -------------------------------------------------------------------------- */
    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 0 8px #FFFFFF;
    }

    .title {
      font-size: clamp(2.5rem, 6.5vw, 5.25rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin: 0 0 20px;
      max-width: 960px;
      color: #FFFFFF;
      text-shadow: 
        0 4px 24px rgba(0, 0, 0, 0.98),
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 0 40px rgba(0, 0, 0, 0.9);
    }

    .subtitle {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
      max-width: 640px;
      margin: 0 0 36px;
      text-shadow: 
        0 2px 16px rgba(0, 0, 0, 0.98),
        0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 30px;
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-silver {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
    }

    .btn-silver:hover {
      box-shadow: 0 6px 28px rgba(255, 255, 255, 0.4);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* --------------------------------------------------------------------------
       ACCESSIBILITY (Reduced Motion)
       -------------------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .smoke span,
      .sheen {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Flowing Silver Smoke Ribbon Engine (Pure CSS Ring Gradients + Blur/Contrast) -->
  <div class="smoke" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- 2. Metallic Sheen Layer (Brushed Metal Striations via soft-light) -->
  <div class="sheen" aria-hidden="true"></div>

  <!-- 3. Film Grain Microstructure (feTurbulence fractalNoise) -->
  <svg class="grain" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- 4. Deep Vignette (Pure Black Border Falloff) -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- 5. Content Layer (Always legible over moving specular ribbons) -->
  <main class="content">
    <div class="pill">
      <span class="pill-dot"></span>
      Liquid Metal Engine
    </div>
    <h1 class="title">Flowing Silver Smoke Ribbons</h1>
    <p class="subtitle">
      Zero JavaScript. Zero canvas. Zero libraries. Pure CSS ring gradients melted by Gaussian blur and sculpted into polished metallic filaments by contrast curves.
    </p>
    <div class="cta-group">
      <a href="#explore" class="btn btn-silver">Explore Dynamics</a>
      <a href="#specs" class="btn btn-outline">View Architecture</a>
    </div>
  </main>

</body>
</html>
