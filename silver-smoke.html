<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Liquid Smoke Ribbons — Pure CSS Background</title>
  <style>
    /* ==========================================================================
       RESET & VIEWPORT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* ==========================================================================
       TUNING KNOBS (Adjust these pairs to customize the effect)
       1. Contrast = edge hardness, Blur = softness (tune as a pair: blur 30-40px, contrast 3.8-5.0)
       2. Spread between shadow and specular stops = strength of the metal effect
       3. .sheen opacity = striation intensity (0.6 - 0.9)
       ========================================================================== */

    /* --------------------------------------------------------------------------
       1. THE SMOKE ENGINE WRAPPER
       Negative inset prevents blurred edges from exposing viewport boundaries.
       High contrast + heavy blur melts ring gradients into defined silver ribbons.
       -------------------------------------------------------------------------- */
    .smoke {
      position: fixed;
      inset: -25%;
      width: 150%;
      height: 150%;
      pointer-events: none;
      z-index: 1;
      filter: blur(28px) contrast(3.2) brightness(0.65);
      overflow: hidden;
      background: #000000;
    }

    .smoke span {
      position: absolute;
      inset: 0;
      will-change: background-position;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       METALLIC PLATINUM MULTI-RIDGE GRADIENTS (+0.3 Complexity)
       Formula: True Platinum (#E5E4E1 / #F5F4F0 / #CAC6BE / #8A857C)
       -------------------------------------------------------------------------- */

    /* Layer 1: 43s duration — Multi-Ridge Harmonic Ribbon */
    .smoke span:nth-child(1) {
      background-image: radial-gradient(ellipse 54% 34% at 35% 40%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            20%,
        rgba(138, 133, 124, 0.38)   27%,
        rgba(202, 198, 190, 0.75)   33%,
        rgba(165, 160, 152, 0.50)   38%,
        rgba(235, 234, 230, 0.95)   46%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(245, 244, 240, 0.92)   54%,
        rgba(180, 175, 167, 0.55)   60%,
        rgba(220, 218, 213, 0.80)   65%,
        rgba(138, 133, 124, 0.40)   71%,
        rgba(0, 0, 0, 0)            78%,
        rgba(0, 0, 0, 0)           100%
      );
      background-size: 210% 210%;
      background-position: 10% 20%;
      transform: rotate(-14deg) scale(1.15);
      animation: driftLayer1 43s ease-in-out infinite alternate;
    }

    /* Layer 2: 53s duration — Multi-Ridge Harmonic Ribbon */
    .smoke span:nth-child(2) {
      background-image: radial-gradient(ellipse 48% 44% at 65% 55%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            18%,
        rgba(130, 125, 117, 0.36)   25%,
        rgba(198, 194, 186, 0.72)   32%,
        rgba(160, 155, 147, 0.48)   37%,
        rgba(232, 230, 226, 0.94)   44%,
        rgba(255, 255, 255, 1.00)   48%,
        rgba(240, 239, 235, 0.90)   52%,
        rgba(175, 170, 162, 0.52)   58%,
        rgba(215, 213, 208, 0.78)   63%,
        rgba(132, 128, 120, 0.38)   69%,
        rgba(0, 0, 0, 0)            76%,
        rgba(0, 0, 0, 0)           100%
      );
      background-size: 250% 220%;
      background-position: 80% 90%;
      transform: rotate(18deg) scale(1.2);
      animation: driftLayer2 53s ease-in-out infinite alternate;
    }

    /* Layer 3: 67s duration — Multi-Ridge Harmonic Ribbon */
    .smoke span:nth-child(3) {
      background-image: radial-gradient(ellipse 58% 30% at 42% 68%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            20%,
        rgba(142, 137, 128, 0.40)   28%,
        rgba(206, 202, 194, 0.76)   34%,
        rgba(170, 165, 156, 0.52)   39%,
        rgba(238, 236, 232, 0.96)   46%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(242, 241, 237, 0.92)   54%,
        rgba(182, 177, 169, 0.54)   60%,
        rgba(224, 222, 217, 0.82)   65%,
        rgba(140, 135, 126, 0.40)   71%,
        rgba(0, 0, 0, 0)            78%,
        rgba(0, 0, 0, 0)           100%
      );
      background-size: 200% 280%;
      background-position: 30% 70%;
      transform: rotate(-28deg) scale(1.12);
      animation: driftLayer3 67s ease-in-out infinite alternate;
    }

    /* Layer 4: 83s duration — Multi-Ridge Harmonic Ribbon */
    .smoke span:nth-child(4) {
      background-image: radial-gradient(ellipse 42% 50% at 72% 32%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            19%,
        rgba(135, 130, 122, 0.38)   26%,
        rgba(200, 196, 188, 0.74)   33%,
        rgba(164, 159, 151, 0.50)   38%,
        rgba(234, 232, 228, 0.94)   45%,
        rgba(255, 255, 255, 1.00)   49%,
        rgba(240, 238, 234, 0.90)   53%,
        rgba(178, 173, 165, 0.52)   59%,
        rgba(218, 216, 211, 0.80)   64%,
        rgba(136, 131, 123, 0.38)   70%,
        rgba(0, 0, 0, 0)            77%,
        rgba(0, 0, 0, 0)           100%
      );
      background-size: 300% 230%;
      background-position: 85% 15%;
      transform: rotate(12deg) scale(1.18);
      animation: driftLayer4 83s ease-in-out infinite alternate;
    }

    /* Layer 5: 109s duration — Multi-Ridge Harmonic Ribbon */
    .smoke span:nth-child(5) {
      background-image: radial-gradient(ellipse 62% 36% at 25% 62%,
        rgba(0, 0, 0, 0)             0%,
        rgba(0, 0, 0, 0)            20%,
        rgba(140, 135, 126, 0.40)   28%,
        rgba(205, 201, 193, 0.76)   34%,
        rgba(168, 163, 155, 0.52)   39%,
        rgba(236, 234, 230, 0.95)   46%,
        rgba(255, 255, 255, 1.00)   50%,
        rgba(242, 240, 236, 0.92)   54%,
        rgba(180, 175, 167, 0.54)   60%,
        rgba(222, 220, 215, 0.82)   65%,
        rgba(140, 135, 126, 0.40)   71%,
        rgba(0, 0, 0, 0)            78%,
        rgba(0, 0, 0, 0)           100%
      );
      background-size: 260% 310%;
      background-position: 15% 85%;
      transform: rotate(-6deg) scale(1.25);
      animation: driftLayer5 109s ease-in-out infinite alternate;
    }

    /* --------------------------------------------------------------------------
       5-POINT ORGANIC MOTION KEYFRAMES (+0.3 Complexity)
       -------------------------------------------------------------------------- */
    @keyframes driftLayer1 {
      0%   { background-position: 10% 20%; }
      28%  { background-position: 50% 38%; }
      55%  { background-position: 85% 45%; }
      78%  { background-position: 60% 75%; }
      100% { background-position: 35% 90%; }
    }

    @keyframes driftLayer2 {
      0%   { background-position: 80% 90%; }
      25%  { background-position: 60% 68%; }
      52%  { background-position: 25% 60%; }
      80%  { background-position: 45% 30%; }
      100% { background-position: 70% 15%; }
    }

    @keyframes driftLayer3 {
      0%   { background-position: 30% 70%; }
      32%  { background-position: 58% 52%; }
      55%  { background-position: 90% 25%; }
      75%  { background-position: 45% 20%; }
      100% { background-position: 15% 35%; }
    }

    @keyframes driftLayer4 {
      0%   { background-position: 85% 15%; }
      28%  { background-position: 45% 38%; }
      55%  { background-position: 15% 80%; }
      82%  { background-position: 35% 92%; }
      100% { background-position: 60% 95%; }
    }

    @keyframes driftLayer5 {
      0%   { background-position: 15% 85%; }
      30%  { background-position: 45% 65%; }
      55%  { background-position: 80% 40%; }
      75%  { background-position: 65% 20%; }
      100% { background-position: 45% 10%; }
    }

    /* --------------------------------------------------------------------------
       2. METALLIC SHEEN LAYER
       -------------------------------------------------------------------------- */
    .sheen {
      position: fixed;
      inset: -15%;
      width: 130%;
      height: 130%;
      pointer-events: none;
      z-index: 2;
      background-image: linear-gradient(
        132deg,
        rgba(0, 0, 0, 0)          0%,
        rgba(202, 198, 190, 0.08) 25%,
        rgba(245, 244, 240, 0.35) 45%,
        rgba(255, 255, 255, 0.50) 50%,
        rgba(229, 228, 225, 0.28) 55%,
        rgba(138, 133, 124, 0.08) 75%,
        rgba(0, 0, 0, 0)          100%
      );
      background-size: 240% 240%;
      background-position: 0% 0%;
      mix-blend-mode: soft-light;
      filter: blur(20px);
      opacity: 0.65;
      will-change: background-position;
      animation: sheenMotion 73s ease-in-out infinite alternate;
    }

    @keyframes sheenMotion {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 40% 100%; }
    }

    /* --------------------------------------------------------------------------
       3. GRAIN LAYER
       -------------------------------------------------------------------------- */
    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.06;
      mix-blend-mode: overlay;
    }

    /* --------------------------------------------------------------------------
       4. VIGNETTE LAYER
       Soft falloff towards borders ensuring pure pitch-black framing.
       -------------------------------------------------------------------------- */
    .vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.6) 100%);
    }

    /* --------------------------------------------------------------------------
       5. CONTENT LAYER (Centered Hero Text)
       Enhanced with deep multi-level text-shadow for permanent legibility.
       -------------------------------------------------------------------------- */
    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 0 8px #FFFFFF;
    }

    .title {
      font-size: clamp(2.5rem, 6.5vw, 5.25rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin: 0 0 20px;
      max-width: 960px;
      color: #FFFFFF;
      text-shadow: 
        0 4px 24px rgba(0, 0, 0, 0.98),
        0 2px 10px rgba(0, 0, 0, 0.95),
        0 0 40px rgba(0, 0, 0, 0.9);
    }

    .subtitle {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
      max-width: 640px;
      margin: 0 0 36px;
      text-shadow: 
        0 2px 16px rgba(0, 0, 0, 0.98),
        0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 30px;
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-silver {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
    }

    .btn-silver:hover {
      box-shadow: 0 6px 28px rgba(255, 255, 255, 0.4);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* --------------------------------------------------------------------------
       ACCESSIBILITY (Reduced Motion)
       -------------------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .smoke span,
      .sheen {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Flowing Silver Smoke Ribbon Engine (Pure CSS Ring Gradients + Blur/Contrast) -->
  <div class="smoke" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- 2. Metallic Sheen Layer (Brushed Metal Striations via soft-light) -->
  <div class="sheen" aria-hidden="true"></div>

  <!-- 3. Film Grain Microstructure (feTurbulence fractalNoise) -->
  <svg class="grain" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- 4. Deep Vignette (Pure Black Border Falloff) -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- 5. Content Layer (Always legible over moving specular ribbons) -->
  <main class="content">
    <div class="pill">
      <span class="pill-dot"></span>
      Liquid Metal Engine
    </div>
    <h1 class="title">Flowing Silver Smoke Ribbons</h1>
    <p class="subtitle">
      Zero JavaScript. Zero canvas. Zero libraries. Pure CSS ring gradients melted by Gaussian blur and sculpted into polished metallic filaments by contrast curves.
    </p>
    <div class="cta-group">
      <a href="#explore" class="btn btn-silver">Explore Dynamics</a>
      <a href="#specs" class="btn btn-outline">View Architecture</a>
    </div>
  </main>

</body>
</html>
